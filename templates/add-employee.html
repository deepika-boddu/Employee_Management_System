<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>

    <title>Add Employee</title>

</head>


<body>

    
    <!-- =========================
         ADD EMPLOYEE SECTION
    ========================= -->

    <div class="container">


        <h1>Add Employee</h1>


        <form action="/add-employee" method="POST">


            <!-- Employee Name -->

            <div class="row">

                <div class="form-group">

                    <label for="name">Employee Name</label>

                    <input type="text" id="name" name="name" placeholder="Enter employee name" required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">

                        Email

                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter email" required>

                </div>

            </div>


            <!-- Phone + Department -->

            <div class="row">


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">

                        Phone Number

                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label for="department">

                        Department


                    </label>


                    <select id="department" name="department" required>


                        <option value="">

                            Select Department

                        </option>


                        <option value="IT">

                            IT

                        </option>


                        <option value="HR">

                            HR

                        </option>


                        <option value="Finance">

                            Finance

                        </option>


                        <option value="Marketing">

                            Marketing

                        </option>


                        <option value="Sales">

                            Sales

                        </option>


                    </select>

                </div>

            </div>


            <!-- Salary + Joining Date -->

            <div class="row">


                <!-- Salary -->

                <div class="form-group">

                    <label for="salary">

                        Salary

                    </label>

                    <input type="number" id="salary" name="salary" placeholder="Enter salary" required>

                </div>


                <!-- Joining Date -->

                <div class="form-group">

                    <label for="joining_date">

                        Joining Date

                    </label>

                    <input type="date" id="joining_date" name="joining_date" required>

                </div>

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">

                    Address

                </label>


                <textarea id="address" name="address" rows="4" placeholder="Enter employee address"></textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">


                <button type="submit" class="add-btn">

                    Add Employee

                </button>


                <button type="reset" class="reset-btn">

                    Reset

                </button>

                <button id="themeBtn"
                       class="theme-btn"
                       onclick="toggleTheme()">
                    🌙 dark
            </button>


            </div>


        </form>


    </div>
    <a href="/home"
           class="back-btn">

            ← Back to home

        </a>



</body>

</html>
