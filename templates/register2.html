<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js" defer></script>

    <title>Register - Employee Management System</title>

    
</head>

<body>


    

    <!-- ================= REGISTER FORM ================= -->

    <div class="register-container">

        <h2>
            Create Account
        </h2>

        <p class="subtitle">
            Register to access the Employee Management System
        </p>


        <form action="/register"
              method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- BUTTONS -->

            <div class="button-group">

                <button
                    type="submit"
                    class="register-btn">

                    Register

                </button>

                <button
                    type="reset"
                    class="reset-btn">

                    Reset

                </button>

                <button id="themeBtn"
                       class="theme-btn"
                       onclick="toggleTheme()">
                    🌙 Dark
                </button>


            </div>


        </form>


        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </p>

    </div>

    <a href="/home"
           class="back-btn">

            ← Back to home

        </a>



</body>

</html>
